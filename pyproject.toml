[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "veschov"
version = "0.1.5"
requires-python = ">=3.13,<=3.14.2"
dependencies = [
  "streamlit>=1.52",
  "streamlit-extras>=0.6.0",
  "st-pages>=1.0.1",
  "streamlit-copy-to-clipboard-button>=1.0",
  "streamlit-aggrid>=1.2.1",
  "pandas>=2.2",
  "pandera>=0.28.1",
  "plotly>=5.20",
  "humanize>=4.15.0",
  "toml>=0.10.2",
]

[tool.pdoc]
output_directory = "docs"
exclude = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
